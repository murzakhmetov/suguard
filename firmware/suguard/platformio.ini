; SuGuard bracelet firmware - PlatformIO project (the sketch folder is the project).
;   pio run -t upload        (hold BOOT/S2 while pressing RESET/S1 if the port does not appear)
;   pio device monitor
;
; Two environments, because the PlatformIO platform decides which Arduino core is used:
;   suguard        platform 6.x -> Arduino core 2.0.17 (ESP-IDF 4.4)
;   suguard-core3  platform 8.x -> Arduino core 3.x (ESP-IDF 5.x), the core the Arduino IDE installs
; The sketch uses only API that exists in both. Neither build could be run where this
; firmware was written (see README.md): if one environment fails to install or build, try the other.
[platformio]
src_dir = .
default_envs = suguard

[env]
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_src_filter = +<*> -<.pio/>

[env:suguard]
platform = espressif32@^6.12.0
; core 2.0.17 is compiled as gnu++11; the firmware needs C++17
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

[env:suguard-core3]
platform = espressif32@^8.0.0
; core 3.x already uses a newer C++ standard: no -std flag here
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
